services:
  db:
    image: postgres:16
    container_name: cybershield-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - cybershield_data:/var/lib/postgresql/data

volumes:
  cybershield_data:
